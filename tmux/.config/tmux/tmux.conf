# Use ctrl-a like screen
set -g prefix C-a
unbind C-b

# Keybindings
unbind %
bind-key | split-window -h
bind-key - split-window -v

# Send C-a to other applications
bind C-a send-prefix

# nested tmux
bind-key a send-prefix

# No bells.  They are annoying
set-option -g bell-action none
set-option -g visual-bell off

# Vi mode
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
unbind-key -T copy-mode-vi Enter
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'wl-copy'
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'wl-copy'
bind -T copy-mode    MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'wl-copy'

set-option -g focus-events on
set -g mouse on

# Start window and pane numbers at 1
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows sequentially after closing any of them
set -g renumber-windows on

# history buffer
set -g history-limit 100000

# Reload the configuration
bind r source ~/.config/tmux/tmux.conf \; display "Configuration reloaded"

# Navigate panes
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes
bind H resize-pane -L 5
bind R resize-pane -R 5
bind J resize-pane -D 5
bind K resize-pane -U 5

# Sync input across panes
bind S setw synchronize-panes

# truecolor
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"

# Rename the window
set-option -g set-titles on
set-option -g set-titles-string '#S:#I:#W'
set-option -g allow-rename off

set -sg escape-time 0
set -g display-time 2000
set -g set-clipboard on
set -g detach-on-destroy off
set -g aggressive-resize on
set -g window-size largest

set -g status-justify "left"
set -g status-interval 5
# set -g window-status-format "#I:#W#{?window_zoomed_flag, ,🔍}"

# bind g new-window -n 'lazygit' lazygit

source ~/.config/tmux/themes/dracula-pro.conf

# Padding row above the status bar (matches terminal background)
if -F '#{!=:#{status},2}' {
  set -Fg 'status-format[1]' '#{status-format[0]}'
  set -g 'status-format[0]' '#[fill=terminal]'
  set -g status 2
}

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

run '~/.config/tmux/plugins/tpm/tpm'

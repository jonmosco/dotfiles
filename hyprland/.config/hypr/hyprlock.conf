general {
    hide_cursor = true
    grace = 5
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    noise = 0.01
    contrast = 0.9
    brightness = 0.8
}

input-field {
    monitor = desc:Dell Inc. DELL U4025QW 71TS984
    size = 300, 50
    outline_thickness = 3
    dots_size = 0.33
    dots_spacing = 0.15
    dots_center = true
    outer_color = rgb(bd93f9)
    inner_color = rgb(282a36)
    font_color = rgb(f8f8f2)
    fade_on_empty = true
    placeholder_text = <i>Password...</i>
    hide_input = false
    rounding = 10
    check_color = rgb(50fa7b)
    fail_color = rgb(ff5555)
    fail_text = <i>$FAIL</i>
    capslock_color = rgb(ffb86c)

    halign = center
    valign = center
    position = 0, -20
}

label {
    monitor = desc:Dell Inc. DELL U4025QW 71TS984
    text = $TIME
    color = rgb(f8f8f2)
    font_size = 64
    font_family = Sans

    halign = center
    valign = center
    position = 0, 100
}

label {
    monitor = desc:Dell Inc. DELL U4025QW 71TS984
    text = cmd[update:3600000] echo "$(date +'%A, %B %d')"
    color = rgb(f8f8f2)
    font_size = 20
    font_family = Sans

    halign = center
    valign = center
    position = 0, 40
}

